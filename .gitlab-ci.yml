stages:
  - test

variables:
  # Cypress stores binary under this path inside container
  CYPRESS_CACHE_FOLDER: /root/.cache/Cypress

cache:
  key: cypress-cache
  paths:
    - /root/.cache/Cypress

run-cypress-tests:
  stage: test
  image: cypress/included:12.12.0
  script:
    - echo "Installing Cypress binary..."
    - npx cypress install
    - echo "Running Cypress tests..."
    - npx cypress run --headless --spec 'cypress/e2e/tests/**/*.cy.js'
