stages:
  - test

variables:
  # Cache Cypress binary to speed up builds
  CYPRESS_CACHE_FOLDER: "$CI_PROJECT_DIR/.cache/Cypress"

run-cypress-tests:
  stage: test
  image: cypress/included:12.12.0  # stable Cypress version for CI
  script:
    - echo "Running Cypress tests headlessly..."
    - cypress run --spec 'cypress/e2e/tests/**/*.cy.js'
