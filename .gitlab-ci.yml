stages:
  - test

variables:
  CYPRESS_CACHE_FOLDER: /root/.cache/Cypress

cache:
  key: cypress-cache
  paths:
    - /root/.cache/Cypress

run-cypress-tests:
  stage: test
  image: cypress/included:12.12.0
  script:
    - echo "Installing Cypress binary..."
    - npx cypress install
    - echo "Running Cypress tests..."
    # Use bash explicitly to avoid shell misinterpretation
    - |
      bash -c "npx cypress run --headless --browser chrome --spec 'cypress/e2e/tests/**/*.cy.js'"
