stages:
  - test

variables:
  # Ensures Cypress binary is downloaded in project directory and cached
  CYPRESS_CACHE_FOLDER: "$CI_PROJECT_DIR/.cache/Cypress"

cache:
  key: cypress-cache
  paths:
    - .cache/Cypress

run-cypress-tests:
  stage: test
  image: cypress/included:12.12.0
  script:
    - echo "Installing Cypress binary..."
    - npx cypress install
    - echo "Running Cypress tests..."
    - npx cypress run --headless --spec 'cypress/e2e/tests/**/*.cy.js'
