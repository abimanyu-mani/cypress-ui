stages:
  - install
  - test

install:
  stage: install
  image: cypress/base:22.0.0
  script:
    - echo "Installing dependencies..."
    - npm ci
    - echo "Installing Cypress binary..."
    - npx cypress install   # <--- ensures binary is downloaded
  artifacts:
    paths:
      - node_modules/
      - ~/.cache/Cypress/   # <--- cache the binary for next stage
    expire_in: 1h

run-tests:
  stage: test
  image: cypress/base:22.0.0
  dependencies:
    - install
  script:
    - echo "Running all Cypress tests..."
    - npm run test:all
  artifacts:
    when: always
    paths:
      - cypress/screenshots
      - cypress/videos
