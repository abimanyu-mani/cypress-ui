stages:
  - build
  - test

# 1️⃣ BUILD STAGE
build:
  stage: build
  image: cypress/base:22.0.0 # includes Node 22 + Chrome + OS deps for Cypress
  script:
    - echo "Installing the dependencies..."
    - npm install

# 2️⃣ TEST STAGE
test:
  stage: test
  image: cypress/base:22.0.0
  script:
    - echo "Running Cypress tests..."
    - npm run test:all
  dependencies:
    - build